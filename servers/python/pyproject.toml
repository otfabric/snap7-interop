[project]
name = "snap-interop-server"
version = "0.1.0"
description = "Pure-Python snap-interop S7 server adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-snap7==3.2.1",
]

[project.scripts]
snap-interop-python = "snap_interop_server.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snap_interop_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["snap_interop_server"]

[[tool.mypy.overrides]]
module = ["snap7", "snap7.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
