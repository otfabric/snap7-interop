name: Release
run-name: "Release ${{ inputs.bump && format('({0}) from {1}', inputs.bump, github.ref_name) || github.ref_name }} by @${{ github.actor }}"

# Tag push: publish that tag. Manual run: bump the latest vX.Y.Z tag (patch by
# default) and publish that from main; the git tag is created with the GitHub
# release, its last step, so a failed run leaves no tag behind.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GOWORK: "off"
  REGISTRY: ghcr.io
  NATIVE_IMAGE: ghcr.io/otfabric/snap7-interop-native
  PYTHON_IMAGE: ghcr.io/otfabric/snap7-interop-python

# Each image is built on a runner of its own architecture (no QEMU), in
# parallel, and pushed by digest. The merge job joins the two digests of an
# image into one multi-arch manifest list under the release tags and signs it.
jobs:
  # The tag to release. Fails before anything is built when the commit is not
  # ready for it: versions.yaml and RELEASE.md must already name that version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "::error::Releases are only allowed from ${DEFAULT_BRANCH}, not ${REF_NAME}"
              exit 1
            fi
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          grep -qF "interop_version: \"${tag#v}\"" versions.yaml \
            || { echo "::error::versions.yaml does not say interop_version: \"${tag#v}\""; exit 1; }
          scripts/release-notes.sh "${tag}" > /dev/null \
            || { echo "::error::RELEASE.md has no notes for ${tag}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME})"

  verify:
    name: verify
    needs: version
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      # The release body is the section of this tag in RELEASE.md, up to its
      # "---" line. Check it before anything is built or pushed.
      - name: RELEASE.md has the notes of the tag
        run: |
          scripts/release-notes.sh "${TAG}" > /dev/null || { echo "::error::RELEASE.md has no notes for ${TAG}"; exit 1; }

      - name: Notices + CI
        run: |
          chmod +x scripts/check-notices.sh
          ./scripts/check-notices.sh
          make ci

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, verify]
    strategy:
      fail-fast: true
      matrix:
        image: [native, python]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image
        id: img
        run: |
          case "${{ matrix.image }}" in
            native) echo "name=${NATIVE_IMAGE}" >> "$GITHUB_OUTPUT" ;;
            python) echo "name=${PYTHON_IMAGE}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for pre-publish scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          sbom: false
          tags: snap7-interop-${{ matrix.image }}:release-scan

      - name: Scan (fixable CRITICAL,HIGH block release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snap7-interop-${{ matrix.image }}:release-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Same builder, so this reuses the layers of the scanned build.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
            org.opencontainers.image.vendor=otfabric

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.image }}
    needs: [version, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [native, python]
    outputs:
      native_digest: ${{ steps.export.outputs.native_digest }}
      python_digest: ${{ steps.export.outputs.python_digest }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Resolve image
        id: img
        run: |
          case "${{ matrix.image }}" in
            native) echo "name=${NATIVE_IMAGE}" >> "$GITHUB_OUTPUT" ;;
            python) echo "name=${PYTHON_IMAGE}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Resolve manifest list digest
        id: export
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.image }}_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ steps.img.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${{ steps.export.outputs.digest }}"

  publish:
    name: publish
    needs: [version, merge]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write release manifest
        env:
          NATIVE_DIGEST: ${{ needs.merge.outputs.native_digest }}
          PYTHON_DIGEST: ${{ needs.merge.outputs.python_digest }}
        run: |
          test -n "${NATIVE_DIGEST}" && test -n "${PYTHON_DIGEST}"
          mkdir -p dist/release
          {
            echo "interop_version: ${TAG#v}"
            echo "git_sha: ${{ github.sha }}"
            echo "native_image: ${NATIVE_IMAGE}"
            echo "native_tag: ${TAG}"
            echo "native_digest: ${NATIVE_DIGEST}"
            echo "python_image: ${PYTHON_IMAGE}"
            echo "python_tag: ${TAG}"
            echo "python_digest: ${PYTHON_DIGEST}"
          } > dist/release/images.txt
          cp versions.yaml dist/release/versions.yaml
          cp THIRD_PARTY_NOTICES.md dist/release/THIRD_PARTY_NOTICES.md
          sha256sum dist/release/images.txt dist/release/versions.yaml dist/release/THIRD_PARTY_NOTICES.md > dist/release/SHA256SUMS
          cat dist/release/images.txt

      - name: Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/source.spdx.json

      # The body is the section of this version in RELEASE.md (up to its
      # "---", as in every otfabric repository), followed by the images.
      - name: Write the release body
        env:
          NATIVE_DIGEST: ${{ needs.merge.outputs.native_digest }}
          PYTHON_DIGEST: ${{ needs.merge.outputs.python_digest }}
        run: |
          {
            scripts/release-notes.sh "${TAG}"
            echo
            echo "## Images"
            echo
            echo "| Image | Digest |"
            echo "|-------|--------|"
            echo "| \`${NATIVE_IMAGE}:${TAG}\` | \`${NATIVE_DIGEST}\` |"
            echo "| \`${PYTHON_IMAGE}:${TAG}\` | \`${PYTHON_DIGEST}\` |"
            echo
            echo "## Pinning in a consumer"
            echo
            echo '```bash'
            echo "docker pull ${NATIVE_IMAGE}@${NATIVE_DIGEST}"
            echo "docker pull ${PYTHON_IMAGE}@${PYTHON_DIGEST}"
            echo '```'
            echo
            echo "\`images.txt\` and \`versions.yaml\` record the images and the upstream pins they were built from. The native image contains Snap7 (LGPL-3.0-or-later), the Python image python-snap7 (MIT); see \`THIRD_PARTY_NOTICES.md\`."
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            dist/release/**
