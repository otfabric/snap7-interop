name: Upstream candidates
run-name: "Candidate upstream probe by @${{ github.actor }}"

# Resolves newer upstreams, builds candidate images, and publishes a pin-vs-latest
# decision table in the workflow Job Summary. Release pins in versions.yaml are never mutated.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  candidate-python-snap7:
    name: python-snap7
    runs-on: ubuntu-latest
    outputs:
      pin: ${{ steps.resolve.outputs.pin }}
      latest: ${{ steps.resolve.outputs.latest }}
      update: ${{ steps.resolve.outputs.update }}
      build: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve python-snap7 pin vs PyPI
        id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request
          from pathlib import Path

          # Prefer versions.yaml; fall back to requirements.txt.
          pin = ""
          text = Path("versions.yaml").read_text()
          in_python = False
          for line in text.splitlines():
              if line.startswith("python_snap7:"):
                  in_python = True
                  continue
              if in_python and line and not line[0].isspace():
                  break
              if in_python and line.strip().startswith("version:"):
                  pin = line.split(":", 1)[1].strip().strip('"').strip("'")
                  break
          if not pin:
              req = Path("servers/python/requirements.txt").read_text()
              for line in req.splitlines():
                  if line.startswith("python-snap7=="):
                      pin = line.split("==", 1)[1].strip()
                      break
          if not pin:
              raise SystemExit("could not read python-snap7 release pin")

          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/python-snap7/json"))
          latest = data["info"]["version"]
          update = "yes" if pin != latest else "no"

          print(f"pin={pin}")
          print(f"latest={latest}")
          print(f"update={update}")
          print(f"resolved pin={pin} latest={latest} update={update}", file=__import__("sys").stderr)
          PY

      - name: Build python image at PyPI latest
        id: build
        continue-on-error: true
        run: |
          cp servers/python/requirements.txt /tmp/requirements.release
          echo "python-snap7==${{ steps.resolve.outputs.latest }}" > servers/python/requirements.txt
          docker build -f servers/python/Dockerfile -t snap-interop-python:candidate .
          mv /tmp/requirements.release servers/python/requirements.txt

  candidate-snap7-tip:
    name: snap7
    runs-on: ubuntu-latest
    outputs:
      pin: ${{ steps.resolve.outputs.pin }}
      pin_tag: ${{ steps.resolve.outputs.pin_tag }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      latest_tag_sha: ${{ steps.resolve.outputs.latest_tag_sha }}
      tip_sha: ${{ steps.resolve.outputs.tip_sha }}
      update: ${{ steps.resolve.outputs.update }}
      tip_build: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve SCADACS/snap7 pin vs upstream
        id: resolve
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import subprocess
          from pathlib import Path

          repo = "https://github.com/SCADACS/snap7.git"
          pin = ""
          text = Path("versions.yaml").read_text()
          in_native = False
          for line in text.splitlines():
              if line.startswith("native_snap7:"):
                  in_native = True
                  continue
              if in_native and line and not line[0].isspace():
                  break
              if in_native and line.strip().startswith("revision:"):
                  pin = line.split(":", 1)[1].strip().strip('"').strip("'")
                  break
          if not pin:
              raise SystemExit("could not read snap7 release pin from versions.yaml")

          tip = subprocess.check_output(
              ["git", "ls-remote", repo, "HEAD"], text=True
          ).split()[0]

          tags = subprocess.check_output(
              ["git", "ls-remote", "--tags", "--refs", repo], text=True
          ).splitlines()

          semver = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")
          pin_tag = ""
          latest_tag = ""
          latest_tag_sha = ""
          latest_key = None

          for line in tags:
              sha, ref = line.split()
              tag = ref.removeprefix("refs/tags/")
              if sha == pin:
                  pin_tag = tag
              m = semver.match(tag)
              if not m:
                  continue
              key = tuple(int(x) for x in m.groups())
              if latest_key is None or key > latest_key:
                  latest_key = key
                  latest_tag = tag
                  latest_tag_sha = sha

          update = "yes" if pin != latest_tag_sha or pin != tip else "no"
          # If the fork has no semver tags, still flag tip drift.
          if not latest_tag_sha:
              update = "yes" if pin != tip else "no"

          print(f"pin={pin}")
          print(f"pin_tag={pin_tag}")
          print(f"latest_tag={latest_tag}")
          print(f"latest_tag_sha={latest_tag_sha}")
          print(f"tip_sha={tip}")
          print(f"update={update}")
          print(
              f"resolved pin={pin} ({pin_tag or 'untagged'}) "
              f"latest={latest_tag or 'n/a'}@{latest_tag_sha[:12] if latest_tag_sha else 'n/a'} "
              f"tip={tip[:12]} update={update}",
              file=__import__("sys").stderr,
          )
          PY

      - name: Build native image at upstream HEAD
        id: build
        continue-on-error: true
        run: |
          docker build --platform=linux/amd64 \
            -f servers/native/Dockerfile \
            --build-arg "SNAP7_REVISION=${{ steps.resolve.outputs.tip_sha }}" \
            -t snap-interop-native:candidate \
            .

  summary:
    name: Decision table
    runs-on: ubuntu-latest
    needs: [candidate-python-snap7, candidate-snap7-tip]
    if: always()
    steps:
      - name: Write pin-vs-latest summary
        env:
          PY_PIN: ${{ needs.candidate-python-snap7.outputs.pin }}
          PY_LATEST: ${{ needs.candidate-python-snap7.outputs.latest }}
          PY_UPDATE: ${{ needs.candidate-python-snap7.outputs.update }}
          PY_BUILD: ${{ needs.candidate-python-snap7.outputs.build }}
          SNAP_PIN: ${{ needs.candidate-snap7-tip.outputs.pin }}
          SNAP_PIN_TAG: ${{ needs.candidate-snap7-tip.outputs.pin_tag }}
          SNAP_LATEST_TAG: ${{ needs.candidate-snap7-tip.outputs.latest_tag }}
          SNAP_LATEST_TAG_SHA: ${{ needs.candidate-snap7-tip.outputs.latest_tag_sha }}
          SNAP_TIP: ${{ needs.candidate-snap7-tip.outputs.tip_sha }}
          SNAP_UPDATE: ${{ needs.candidate-snap7-tip.outputs.update }}
          SNAP_BUILD: ${{ needs.candidate-snap7-tip.outputs.tip_build }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os

          def short(sha: str, n: int = 12) -> str:
              return sha[:n] if sha else "?"

          py_pin = os.environ.get("PY_PIN", "")
          py_latest = os.environ.get("PY_LATEST", "")
          py_update = os.environ.get("PY_UPDATE", "?")
          py_build = os.environ.get("PY_BUILD", "?")

          snap_pin = os.environ.get("SNAP_PIN", "")
          snap_pin_tag = os.environ.get("SNAP_PIN_TAG", "")
          snap_latest_tag = os.environ.get("SNAP_LATEST_TAG", "")
          snap_latest_sha = os.environ.get("SNAP_LATEST_TAG_SHA", "")
          snap_tip = os.environ.get("SNAP_TIP", "")
          snap_update = os.environ.get("SNAP_UPDATE", "?")
          snap_build = os.environ.get("SNAP_BUILD", "?")

          if snap_pin_tag:
              snap_pin_label = f"`{snap_pin_tag}` (`{short(snap_pin)}`)"
          else:
              snap_pin_label = f"`{short(snap_pin)}`"

          if snap_latest_tag and snap_latest_sha:
              snap_latest_label = (
                  f"`{snap_latest_tag}` (`{short(snap_latest_sha)}`)<br>HEAD `{short(snap_tip)}`"
              )
          else:
              snap_latest_label = f"HEAD `{short(snap_tip)}`"

          print("## Upstream candidate report")
          print()
          print("Release pins were **not** modified. Use this table to decide whether to bump.")
          print()
          print("| Stack | Kind | Release pin | Latest upstream | Candidate build | Update? |")
          print("|---|---|---|---|---|---|")
          print(
              f"| [python-snap7](https://pypi.org/project/python-snap7/) | PyPI semver | "
              f"`{py_pin}` | `{py_latest}` | `{py_build}` | **{py_update}** |"
          )
          print(
              f"| [SCADACS/snap7](https://github.com/SCADACS/snap7) | git SHA | "
              f"{snap_pin_label} | {snap_latest_label} | `{snap_build}` (HEAD) | **{snap_update}** |"
          )
          print()
          print("### Pin locations")
          print()
          print("- python-snap7: `versions.yaml` (`python_snap7.version`) / `servers/python/requirements.txt`")
          print("- snap7: `versions.yaml` (`native_snap7.revision`)")
          print()
          print("### How to read this")
          print()
          print("- **Update? = yes** means pin ≠ latest release and/or tip.")
          print("- **Candidate build** is a Docker build of tip/latest only; it does not run the interop probe.")
          print("- Bump deliberately after reviewing upstream changelog / release notes.")
          PY
