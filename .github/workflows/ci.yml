name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml==6.0.2"
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: make ci
        env:
          GOWORK: "off"
        run: make ci

  native-smoke:
    name: native-smoke
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Native image smoke (read/write)
        env:
          GOWORK: "off"
        run: make smoke-native

  python-smoke:
    name: python-smoke
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Python image smoke (read/write)
        env:
          GOWORK: "off"
        run: make smoke-python
