name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

env:
  GOWORK: "off"

jobs:
  go-ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.2.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      run-codecov: false
      go-versions: '["1.25","1.26"]'
    secrets: inherit

  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml==6.0.2"
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: RELEASE.md has the notes of interop_version
        run: scripts/release-notes.sh > /dev/null

      - name: make ci
        run: make ci

  notices:
    name: notices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: check-notices
        run: |
          chmod +x scripts/check-notices.sh
          ./scripts/check-notices.sh

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # anchore/sbom-action writeFileSync's output-file and does not mkdir parents
      - name: Create SBOM output directory
        run: mkdir -p dist/sbom

      - name: Source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom/source.spdx.json

      - name: Source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom/source.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/sbom/

  native-smoke:
    name: native-smoke${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_PLATFORM: linux/${{ matrix.arch }}
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Native image smoke (read/write)
        run: make smoke-native

  python-smoke:
    name: python-smoke${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_PLATFORM: linux/${{ matrix.arch }}
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Python image smoke (read/write)
        run: make smoke-python

  scan:
    name: scan${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_PLATFORM: linux/${{ matrix.arch }}
    needs: [native-smoke, python-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build images for scan
        run: make images

      - name: Scan native (fixable CRITICAL blocks PR)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snap7-interop-native:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan python (fixable CRITICAL blocks PR)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snap7-interop-python:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  interop:
    name: interop${{ matrix.arch == 'arm64' && ' (arm64)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_PLATFORM: linux/${{ matrix.arch }}
    needs: [native-smoke, python-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Dual-server interop gate
        run: make interop

      - name: Upload interop reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-reports-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore
