# Local dual-server layout.
# Suggested host ports avoid binding privileged host port 102.
#
# Do not expose these listeners to untrusted networks.
#
#   make native && docker compose --profile native up -d
#   make probe

name: snap-interop

services:
  native:
    profiles: ["native", "servers"]
    build:
      context: .
      dockerfile: servers/native/Dockerfile
      platforms:
        - linux/amd64
    image: snap-interop-native:local
    platform: linux/amd64
    environment:
      SNAP_INTEROP_FIXTURE: /fixtures/basic-db.compiled.json
      SNAP_INTEROP_LISTEN_ADDRESS: "0.0.0.0"
      SNAP_INTEROP_PORT: "102"
      SNAP_INTEROP_LOG_FORMAT: json
      SNAP_INTEROP_STATE_PATH: /run/snap-interop/state.json
    ports:
      - "1102:102"
    volumes:
      - ./fixtures/compiled:/fixtures:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run/snap-interop:uid=10001,gid=10001,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/102"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  python:
    profiles: ["python", "servers"]
    build:
      context: ./servers/python
      dockerfile: Dockerfile
    image: snap-interop-python:local
    environment:
      SNAP_INTEROP_FIXTURE: /fixtures/basic-db.compiled.json
      SNAP_INTEROP_LISTEN_ADDRESS: "0.0.0.0"
      SNAP_INTEROP_PORT: "102"
      SNAP_INTEROP_LOG_FORMAT: json
      SNAP_INTEROP_STATE_PATH: /run/snap-interop/state.json
    ports:
      - "2102:102"
    volumes:
      - ./fixtures/compiled:/fixtures:ro
      - python-run:/run/snap-interop
    read_only: true
    tmpfs:
      - /tmp

volumes:
  python-run:
