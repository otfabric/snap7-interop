# Machine-readable version manifest for snap7-interop.
# Image digests and upstream pins are release artifacts; do not float tags.

interop_version: "0.6.1"
contract_version: "1.1"       # docs/CONTAINER_CONTRACT.md
fixture_schema: "1.0.0"
fixture_compiler: "0.1.0"

native_snap7:
  repository: "https://github.com/SCADACS/snap7"
  revision: "f6ff90317ca5d54250f4dcd29209689a74e26d82"
  license: "LGPL-3.0-or-later"
  note: "SCADACS fork (Snap7 1.4.0 lineage). linux/arm64 uses in-tree aarch64_linux.mk."

python_snap7:
  package: "python-snap7"
  version: "3.2.1"
  extras: []
  note: "Pure-Python Server API (snap7.server.Server). Image must not load libsnap7."

base_images:
  # Digests recorded 2026-07-17; Dockerfiles pin these by digest.
  debian_bookworm_slim: "docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  python_3_12_slim_bookworm: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"
  native_builder: "docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  native_runtime: "docker.io/library/debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  python_runtime: "docker.io/library/python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b"

tooling:
  go: "1.25"
  python: "3.12"

images:
  native: "ghcr.io/otfabric/snap7-interop-native"
  python: "ghcr.io/otfabric/snap7-interop-python"

# Our own stack behind the same contract (ADR-0012 in otfabric/engineering).
# Not an independent implementation and not part of a harness release: the
# manual workflow .github/workflows/own-go-s7comm.yml builds it from the latest
# go-s7comm release and publishes :<go-s7comm version> and :latest. No pin.
own_implementations:
  otfabric:
    image: "ghcr.io/otfabric/snap7-interop-otfabric"
    library: "github.com/otfabric/go-s7comm"
    source: "own/go-s7comm"
    independent_engine: false
    base_images:
      build: "docker.io/library/golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"
      runtime: "docker.io/library/debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4"

platforms:
  - "linux/amd64"
  - "linux/arm64"

security:
  release_blocking_severities:
    - CRITICAL
    - HIGH
  pr_blocking_severities:
    - CRITICAL
